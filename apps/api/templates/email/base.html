<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Adborth, by Stori Cymru: a white rounded card on a stone ground,
           the navy brand band on top, one red pill for the thing to do. */
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #111111;
            margin: 0;
            padding: 0;
            background-color: #efeeeb;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 16px;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            overflow: hidden;
        }
        .logo {
            background-color: #1b365d;
            padding: 26px 36px;
            text-align: left;
        }
        .logo h1 {
            color: #ffffff;
            font-family: 'Outfit', 'DM Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin: 0;
        }
        .content {
            padding: 36px;
        }
        h2 {
            color: #111111;
            font-family: 'Outfit', 'DM Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
            font-weight: 800;
            font-size: 24px;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin: 0 0 16px 0;
        }
        p {
            margin: 0 0 16px 0;
            color: #4f4f4f;
        }
        strong {
            color: #111111;
        }
        .button {
            display: inline-block;
            padding: 14px 28px;
            background-color: #cb2c30;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
            margin: 16px 0;
        }
        .button:hover {
            background-color: #a3201f;
        }
        .code {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #111111;
            text-align: center;
            padding: 24px;
            background: #f6f5f3;
            border-radius: 18px;
            margin: 16px 0;
        }
        .quote {
            padding: 14px 18px;
            margin: 16px 0;
            color: #4f4f4f;
            background: #f6f5f3;
            border-radius: 18px;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #6b6b6b;
            font-size: 13px;
        }
        .footer p {
            color: #6b6b6b;
            margin: 0 0 6px 0;
        }
        .muted {
            color: #6b6b6b;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                {% if site_url %}
                <img src="{{ site_url }}/brand/adborth-lockup-white.png" alt="Adborth" height="38" style="display: block; height: 38px; width: auto; border: 0; color: #ffffff; font-size: 26px; font-weight: 800;">
                {% else %}
                <h1>Adborth</h1>
                {% endif %}
            </div>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </div>
        <div class="footer">
            {% if site_url %}
            <img src="{{ site_url }}/brand/stori-cymru-logo-red.png" alt="Stori Cymru" height="34" style="height: 34px; width: auto; border: 0; margin: 4px 0 10px 0;">
            {% endif %}
            <p>Adborth · video review and sign-off by Stori Cymru</p>
            <p class="muted">
                You're receiving this email because you have an account on {{ org_name }}. © {{ year }}
            </p>
        </div>
    </div>
</body>
</html>

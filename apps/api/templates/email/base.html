<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Stori Cymru Adborth: navy and red, as in Cylch. */
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1b2a44;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .logo {
            background-color: #1b365d;
            border-bottom: 4px solid #cb2c30;
            padding: 22px 32px;
            text-align: left;
        }
        .logo h1 {
            color: #ffffff;
            font-family: 'Outfit', 'DM Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .content {
            padding: 32px;
        }
        h2 {
            color: #1b365d;
            font-family: 'Outfit', 'DM Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.01em;
            margin: 0 0 16px 0;
        }
        p {
            margin: 0 0 16px 0;
            color: #45526b;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #cb2c30;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            margin: 16px 0;
        }
        .button:hover {
            background-color: #b0252a;
        }
        .code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #1b365d;
            text-align: center;
            padding: 24px;
            background: #fdecef;
            border-radius: 8px;
            margin: 16px 0;
        }
        .quote {
            border-left: 3px solid #cb2c30;
            padding-left: 16px;
            margin: 16px 0;
            color: #45526b;
            font-style: italic;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #6d6e6f;
            font-size: 13px;
        }
        .footer p {
            color: #6d6e6f;
            margin: 0 0 6px 0;
        }
        .muted {
            color: #6d6e6f;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>{{ org_name }}</h1>
            </div>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </div>
        <div class="footer">
            <p>© {{ year }} {{ org_name }}</p>
            <p class="muted">
                You're receiving this email because you have an account on {{ org_name }}.
            </p>
        </div>
    </div>
</body>
</html>
